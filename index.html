<title>Cricket Scoreboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Anek+Bangla:wght@800&display=swap" rel="stylesheet">
<style>
/* Layout: sticky broadcast header, compact cards, bottom-aligned thumb controls; match view is tabbed on phones and two-column (score | commentary) from 900px. */
:root{--bg:#14161a;--card:#1d2127;--card2:#252a31;--line:#2f353d;--tx:#f1f2f4;--mu:#98a1ab;--or:#ee7a1f;--orS:rgba(238,122,31,.14);--btn:#2a2f37;--hd:#14161a;--c1:#e0681a;--c2:#4c86f0;--sh:0 1px 0 rgba(0,0,0,.2);color-scheme:dark;--rd:#e5484d;--gr:#3fb27f;--bl:#4c8dff;--pu:#8a5cf0;--yl:#f2c200;--hh:52px}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]):not([data-skin]){--bg:#f3f0ea;--card:#ffffff;--card2:#f1ede6;--line:#ddd6cb;--tx:#1b1d21;--mu:#626972;--or:#d9650d;--orS:rgba(217,101,13,.12);--btn:#ece7de;--hd:#f3f0ea;--c1:#d9650d;--c2:#2f6fe0;--sh:0 1px 3px rgba(40,30,10,.08);color-scheme:light}}
:root[data-theme="light"]:not([data-skin]){--bg:#f3f0ea;--card:#ffffff;--card2:#f1ede6;--line:#ddd6cb;--tx:#1b1d21;--mu:#626972;--or:#d9650d;--orS:rgba(217,101,13,.12);--btn:#ece7de;--hd:#f3f0ea;--c1:#d9650d;--c2:#2f6fe0;--sh:0 1px 3px rgba(40,30,10,.08);color-scheme:light}
:root[data-skin="light"]{--bg:#f3f0ea;--card:#ffffff;--card2:#f1ede6;--line:#ddd6cb;--tx:#1b1d21;--mu:#626972;--or:#d9650d;--orS:rgba(217,101,13,.12);--btn:#ece7de;--hd:#f3f0ea;--c1:#d9650d;--c2:#2f6fe0;--sh:0 1px 3px rgba(40,30,10,.08);color-scheme:light}
:root[data-skin="dark"]{--bg:#14161a;--card:#1d2127;--card2:#252a31;--line:#2f353d;--tx:#f1f2f4;--mu:#98a1ab;--or:#ee7a1f;--orS:rgba(238,122,31,.14);--btn:#2a2f37;--hd:#14161a;--c1:#e0681a;--c2:#4c86f0;--sh:0 1px 0 rgba(0,0,0,.2);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:56px}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hind Siliguri","Noto Sans Bengali","Segoe UI",Arial,sans-serif;font-weight:600;font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hd)}
h1,h2,h3,.big,.hd{font-family:"Anek Bangla","Hind Siliguri","Noto Sans Bengali",Arial,sans-serif;font-weight:800}
button{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding-block:0 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hd);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:8px}
header.top h1{margin:0;font-size:1.35rem;color:var(--or);cursor:pointer;letter-spacing:.2px;white-space:nowrap}
.hr{display:flex;gap:6px;align-items:center}
.tg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}.tg button{border:0;background:none;color:var(--mu);padding:6px 10px;font-weight:700;cursor:pointer;min-height:34px}.tg button.on{background:var(--or);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;min-width:0}
.card.flat{padding:0;overflow:hidden}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.tab,.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--tx);padding:6px 13px;border-radius:999px;font-weight:700;cursor:pointer;min-height:36px;flex:none}
.tab.on,.chip.on{background:var(--or);border-color:var(--or);color:#fff}
.chip.sm{padding:3px 10px;min-height:28px;font-size:.85rem}
.chip.mu{color:var(--mu)}
.sn{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:8px;overflow-x:auto;scrollbar-width:none}.sn::-webkit-scrollbar{display:none}
.sn button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mu);padding:8px 12px;font-weight:800;cursor:pointer;white-space:nowrap;min-height:40px;flex:none}
.sn button.on{color:var(--or);border-bottom-color:var(--or)}
.live{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;color:#fff;background:var(--rd);font-weight:800;border-radius:6px;padding:1px 7px;letter-spacing:.4px}.live i{width:7px;height:7px;border-radius:50%;background:#fff;animation:p 1.2s infinite}
@keyframes p{50%{opacity:.25}}
.pill{display:inline-block;font-size:.74rem;font-weight:800;padding:1px 8px;border-radius:6px;background:var(--card2);color:var(--mu);border:1px solid var(--line);letter-spacing:.3px}
.pill.or{background:var(--orS);color:var(--or);border-color:var(--or)}.pill.gr{background:rgba(63,178,127,.15);color:var(--gr);border-color:var(--gr)}.pill.rd{background:rgba(229,72,77,.14);color:var(--rd);border-color:var(--rd)}.pill.bl{background:rgba(76,141,255,.14);color:var(--bl);border-color:var(--bl)}
.mu{color:var(--mu);font-size:.86rem}.or{color:var(--or)}.sm{font-size:.82rem}.r{text-align:right}.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mc{cursor:pointer}.mc:active{border-color:var(--or)}
.mh{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:4px}
.tr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 0}.tr .nm{display:flex;align-items:center;gap:7px;min-width:0}.tr b{font-size:1.05rem;white-space:nowrap}
.lg{display:inline-grid;place-items:center;flex:none;width:26px;height:26px;border-radius:50%;background:var(--c,var(--or));color:#fff;font-size:.68rem;font-weight:800;overflow:hidden;line-height:1}
.lg img{width:100%;height:100%;object-fit:cover}.lg.l{width:38px;height:38px;font-size:.9rem}
.big{font-size:3.1rem;line-height:1;margin:0}.big small{font-size:1.4rem;color:var(--mu)}
.sb{background:linear-gradient(135deg,var(--orS),transparent 60%),var(--card);border-color:var(--or)}
.sb .tm{display:flex;align-items:center;gap:8px;font-size:1.15rem;font-weight:800}
.sb .sc{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.stat{display:flex;gap:2px 14px;flex-wrap:wrap;font-size:.92rem;margin-top:4px;color:var(--mu)}.stat b{color:var(--tx);font-size:1.02rem}
.hdr2{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.82rem;color:var(--mu);margin-bottom:6px}
.ban{border-radius:10px;padding:6px 10px;margin-bottom:8px;text-align:center;font-family:"Anek Bangla","Hind Siliguri",sans-serif;font-weight:800;font-size:1.2rem;color:#fff;animation:pu 1.4s infinite}
.ban small{display:block;font-size:.82rem;font-weight:700;opacity:.92}
.ban.w{background:var(--rd)}.ban.f{background:var(--or)}.ban.s{background:var(--pu)}.ban.o{background:var(--bl)}.ban.x{background:#a07414}.ban.d{background:var(--gr);animation:none}
@keyframes pu{50%{transform:scale(1.012)}}
.balls{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.b{min-width:30px;height:30px;padding:0 4px;border-radius:50%;display:grid;place-items:center;background:var(--btn);border:1px solid var(--line);font-size:.8rem;font-weight:800}
.b.f{background:var(--or);color:#fff;border-color:var(--or)}.b.s{background:var(--pu);color:#fff;border-color:var(--pu)}.b.w{background:var(--rd);color:#fff;border-color:var(--rd)}.b.x{background:#a07414;color:#fff;border-color:#a07414}
table{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}td,th{padding:5px 4px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}td:first-child,th:first-child{text-align:left;white-space:normal}th{color:var(--mu);font-size:.74rem;font-weight:700}.scr{overflow-x:auto}
tr.q td{background:var(--orS)}tr.q td:first-child{box-shadow:inset 3px 0 0 var(--or)}
.tn{display:flex;align-items:center;gap:6px;min-width:0}
.pl{display:flex;justify-content:space-between;gap:8px;padding:4px 0;font-size:1rem}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

@media (prefers-color-scheme:light){:root:not([data-theme="dark"]):not([data-skin]){--bg:#e9f3fc;--bg2:#d9ebfa;--card:rgba(255,255,255,.80);--card2:rgba(236,246,255,.9);--line:rgba(70,130,190,.24);--tx:#0c2036;--mu:#547089;--or:#1673cc;--orS:rgba(22,115,204,.12);--btn:rgba(232,243,254,.95);--hd:#e9f3fc;--c1:#1673cc;--c2:#f08a1c;--bl:#0a9fbd;--sh:0 6px 22px rgba(30,100,170,.10);--glass:rgba(255,255,255,.62);--glassb:rgba(255,255,255,.9);--gsh:0 8px 30px rgba(30,100,170,.16);--ring:rgba(22,115,204,.07);--ball:#1673cc;color-scheme:light}}
:root[data-theme="light"]:not([data-skin]),:root[data-skin="light"]{--bg:#e9f3fc;--bg2:#d9ebfa;--card:rgba(255,255,255,.80);--card2:rgba(236,246,255,.9);--line:rgba(70,130,190,.24);--tx:#0c2036;--mu:#547089;--or:#1673cc;--orS:rgba(22,115,204,.12);--btn:rgba(232,243,254,.95);--hd:#e9f3fc;--c1:#1673cc;--c2:#f08a1c;--bl:#0a9fbd;--sh:0 6px 22px rgba(30,100,170,.10);--glass:rgba(255,255,255,.62);--glassb:rgba(255,255,255,.9);--gsh:0 8px 30px rgba(30,100,170,.16);--ring:rgba(22,115,204,.07);--ball:#1673cc;color-scheme:light}
:root[data-skin="dark"]{--bg:#06121f;--bg2:#0a1c30;--card:rgba(16,34,58,.74);--card2:rgba(22,46,76,.85);--line:rgba(120,175,235,.2);--tx:#e8f2ff;--mu:#8ba7c6;--or:#2f8cf0;--orS:rgba(47,140,240,.17);--btn:rgba(26,52,86,.9);--hd:#06121f;--c1:#4aa3ff;--c2:#f5a340;--bl:#26bfd6;--sh:0 6px 22px rgba(0,0,0,.35);--glass:rgba(14,32,56,.58);--glassb:rgba(150,200,255,.2);--gsh:0 10px 34px rgba(0,0,0,.45);--ring:rgba(120,180,255,.06);--ball:#6db4ff;color-scheme:dark}
html{background:var(--bg)}
body{background:radial-gradient(900px 420px at 90% -8%,rgba(110,185,255,.38),transparent 62%),radial-gradient(700px 380px at -8% 6%,rgba(255,255,255,.55),transparent 60%),linear-gradient(180deg,var(--bg),var(--bg2)) fixed;background-color:var(--bg)}
body::after{content:"";position:fixed;left:-30%;right:-30%;bottom:-38vh;height:80vh;z-index:-1;pointer-events:none;border-radius:50%;background:repeating-radial-gradient(ellipse at 50% 50%,transparent 0 46px,var(--ring) 46px 48px)}
.wrap::before{content:"";position:fixed;top:64px;right:-70px;width:260px;height:260px;z-index:-1;pointer-events:none;opacity:.10;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none' stroke='%231673cc' stroke-width='2.2' stroke-linecap='round'><circle cx='50' cy='50' r='46'/><path d='M14 28c22 10 22 34 0 44M86 28c-22 10-22 34 0 44'/><path d='M20 32l5 3M22 40l6 2M22 48l6 1M22 56l6-1M22 64l6-2M80 32l-5 3M78 40l-6 2M78 48l-6 1M78 56l-6-1M78 64l-6-2' stroke-width='1.6'/></svg>") no-repeat center/contain}
header.top{top:calc(env(safe-area-inset-top,0px) + 6px);margin:6px 0 12px;padding:7px 10px;border-radius:22px;border:1px solid var(--glassb);background:var(--glass);-webkit-backdrop-filter:saturate(190%) blur(22px);backdrop-filter:saturate(190%) blur(22px);box-shadow:var(--gsh),inset 0 1px 0 rgba(255,255,255,.55)}
header.top h1{display:flex;align-items:center;gap:9px;color:var(--tx);font-size:1rem;min-width:0}
header.top h1 .bl{height:38px;width:auto;max-width:56px;object-fit:contain;filter:drop-shadow(0 2px 5px rgba(22,115,204,.3))}
header.top h1 .bat{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:linear-gradient(145deg,#4fb0ff,var(--or));font-size:1.2rem;box-shadow:0 4px 12px rgba(22,115,204,.35)}
.bt2{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.bt2 b{font-size:1.12rem;letter-spacing:.2px;white-space:nowrap}
.bt2 b span{color:var(--or);font-weight:600;font-size:.78em;padding:0 1px}
.bt2 small{display:flex;align-items:center;gap:5px;margin-top:3px;font-size:.62rem;color:var(--mu);font-weight:800;letter-spacing:.3px;white-space:nowrap}
.bh{width:20px;height:20px;border-radius:50%;object-fit:cover;background:#fff;box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--or),0 0 12px rgba(22,115,204,.55)}
.mono{display:inline-grid;place-items:center;min-width:24px;height:17px;padding:0 6px;border-radius:9px;background:linear-gradient(135deg,#55b4ff,var(--or));color:#fff;font-size:.6rem;font-weight:800;box-shadow:0 0 10px rgba(22,115,204,.45)}
.mono.big{width:64px;height:64px;border-radius:50%;font-size:1.1rem}
.tg{background:var(--glass);border-color:var(--glassb);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.tg button.on,.tab.on,.chip.on,.prog span.on,button.k.pri,button.k.r4{background:linear-gradient(180deg,#3d9df2,var(--or));border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(22,115,204,.32)}
.tab,.chip,.ib{background:var(--glass);border-color:var(--glassb);box-shadow:0 1px 6px rgba(30,100,170,.08);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.card,.mhead,.sec{border-radius:18px;border-color:var(--glassb);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.5);-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%)}
.card.warn{border-color:var(--or)}
.sec>h3{background:linear-gradient(90deg,var(--orS),transparent)}
button.k{border-radius:14px;border-color:var(--glassb);box-shadow:0 1px 5px rgba(30,100,170,.10)}
input,select,textarea{border-radius:12px;background:var(--card2);border-color:var(--line)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--or);outline-offset:1px}
.sn{border:1px solid var(--glassb);background:var(--glass);border-radius:16px;padding:4px;gap:4px;box-shadow:var(--sh);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%)}
.sn button{border:0;border-radius:12px;color:var(--mu)}
.sn button.on{background:linear-gradient(180deg,#3d9df2,var(--or));color:#fff;box-shadow:0 3px 10px rgba(22,115,204,.35)}
.sn.stk{top:calc(env(safe-area-inset-top,0px) + var(--hh));border-radius:18px;margin:0 0 10px;padding:4px;gap:4px;background:var(--glass);overflow:visible}
.sn.stk button{border:0;background:transparent;color:var(--mu);border-radius:14px;min-height:50px;box-shadow:none}
.sn.stk button.on{background:linear-gradient(180deg,#3d9df2,var(--or));color:#fff}
.bnav{left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));border:1px solid var(--glassb);border-radius:26px;background:var(--glass);-webkit-backdrop-filter:saturate(190%) blur(24px);backdrop-filter:saturate(190%) blur(24px);box-shadow:var(--gsh),inset 0 1px 0 rgba(255,255,255,.5);padding:5px 6px}
.bnav button.on{background:linear-gradient(180deg,#3d9df2,var(--or));color:#fff;box-shadow:0 4px 12px rgba(22,115,204,.35)}
body.isadm .wrap{padding-bottom:104px}body.isadm .toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.sheet>div,.mdl>div{background:var(--glass);border:1px solid var(--glassb);-webkit-backdrop-filter:saturate(190%) blur(26px);backdrop-filter:saturate(190%) blur(26px);box-shadow:var(--gsh)}
.mdl,.sheet{background:rgba(8,28,52,.38);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.toast{background:rgba(12,32,54,.88);color:#fff;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.pill.or{background:var(--orS);color:var(--or);border-color:var(--or)}
.ban.f{background:linear-gradient(135deg,#2f9bf5,var(--or))}
.lg.im{background:#fff;border:1px solid var(--line)}.lg img{object-fit:contain}.lg.im img{padding:1px}
.lg.tl{margin-right:2px}
.hdr2 .lg.l{width:44px;height:44px}
.lpick{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.lp{width:42px;height:42px;padding:3px;border-radius:12px;border:2px solid var(--line);background:#fff;cursor:pointer}.lp img{width:100%;height:100%;object-fit:contain}
.lp.on{border-color:var(--or);box-shadow:0 0 0 3px var(--orS)}.lp.x{display:grid;place-items:center;color:var(--rd);font-weight:800;background:var(--card2)}
.lib .libimg{width:56px;height:56px;border-radius:14px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;flex:none;overflow:hidden}.libimg img{max-width:100%;max-height:100%;object-fit:contain}
.credit{display:flex;align-items:center;gap:14px;margin:18px 0 6px;padding:14px 16px;border-radius:22px;border:1px solid var(--glassb);background:linear-gradient(135deg,var(--glass),var(--orS));-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:var(--gsh)}
.credit .fh{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#fff;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--or),0 0 22px rgba(22,115,204,.55);flex:none}
.credit b{font-size:1.02rem;color:var(--tx)}
/* v4 fixes */
html::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(900px 420px at 90% -8%,rgba(110,185,255,.38),transparent 62%),radial-gradient(700px 380px at -8% 6%,rgba(255,255,255,.55),transparent 60%),linear-gradient(180deg,var(--bg),var(--bg2))}
body{background:transparent}
.tab,.chip,.ib{-webkit-backdrop-filter:none;backdrop-filter:none}
.bt2 b{font-size:1rem}.hr{gap:5px}
header.top .tab{padding:4px 10px}.tg button{padding:6px 8px}header.top .ib{width:36px;min-width:36px;padding:0}
header.top h1{flex:1 1 auto;overflow:hidden}
@media (max-width:420px){.bt2 b{font-size:.95rem}.bt2 small .byt{display:none}header.top h1 .bat,header.top h1 .bl{height:34px}}
:root{--g2:rgba(80,150,230,.10)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]):not([data-skin]){--g2:rgba(255,255,255,.55)}}
:root[data-theme="light"]:not([data-skin]),:root[data-skin="light"]{--g2:rgba(255,255,255,.55)}
:root[data-skin="dark"]{--g2:rgba(80,150,230,.10)}
html::before{background:radial-gradient(900px 420px at 90% -8%,rgba(110,185,255,.38),transparent 62%),radial-gradient(700px 380px at -8% 6%,var(--g2),transparent 60%),linear-gradient(180deg,var(--bg),var(--bg2))}
@media (max-width:420px){header.top h1{gap:7px}header.top h1 .bl{max-width:40px;height:34px}.bt2 b{font-size:.9rem}header.top h1{overflow:visible}.bt2{overflow:visible}}
.bh{height:24px;width:auto;max-width:64px;border-radius:9px;padding:2px 5px;background:#fff;object-fit:contain;box-shadow:0 0 0 1.5px var(--or),0 0 12px rgba(22,115,204,.5)}
.credit .fh{height:76px;width:auto;max-width:150px;border-radius:20px;padding:6px 10px;background:#fff;object-fit:contain;box-shadow:0 0 0 2px var(--or),0 0 24px rgba(22,115,204,.5)}
header.top h1 .bl{max-width:44px}
.lg.im img{object-fit:contain;padding:2px}
/* ===== scoring bars + square glass pad ===== */
.sbar{border-radius:20px;padding:12px;margin-bottom:10px;border:1px solid var(--glassb);background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:var(--gsh),inset 0 1px 0 rgba(255,255,255,.55)}
.sb1{display:flex;align-items:stretch;justify-content:space-between;gap:10px}
.sb-t{min-width:0;flex:1}
.sb-sc{font-size:3rem;font-weight:800;line-height:1;margin-top:6px;letter-spacing:-1px;color:var(--tx)}.sb-sc small{font-size:1.5rem;color:var(--mu);font-weight:700}
.sb-ov{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:96px;padding:8px 12px;border-radius:18px;background:linear-gradient(160deg,#4aa8f7,var(--or));color:#fff;box-shadow:0 8px 20px rgba(22,115,204,.35),inset 0 1px 0 rgba(255,255,255,.4)}
.sb-ov small{font-size:.66rem;letter-spacing:1.4px;text-transform:uppercase;opacity:.9;font-weight:800}.sb-ov b{font-size:2.3rem;line-height:1.05;font-weight:800}.sb-ov i{font-style:normal;font-size:.8rem;opacity:.9;font-weight:700}
.sb-bits{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.sb-bits span{padding:4px 10px;border-radius:999px;background:var(--orS);color:var(--mu);font-size:.8rem}.sb-bits b{color:var(--tx)}
.lastb{flex:none;width:92px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 4px;text-align:center;color:#fff;background:linear-gradient(160deg,#6b7f95,#46586c);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 16px rgba(20,60,100,.25)}
.lastb small{font-size:.6rem;letter-spacing:1px;text-transform:uppercase;opacity:.85;font-weight:800}.lastb b{font-size:2.3rem;line-height:1.05}.lastb span{font-size:.7rem;font-weight:800;opacity:.95}
.lastb.f{background:linear-gradient(160deg,#4aa8f7,#1673cc)}.lastb.s{background:linear-gradient(160deg,#a67cf5,#7a47e0)}.lastb.w{background:linear-gradient(160deg,#f06a6e,#d12f35)}.lastb.x{background:linear-gradient(160deg,#d9a21f,#a77a0c)}.lastb.n{background:linear-gradient(160deg,#35c28e,#1f9a6d)}
.lastb.new{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.bbs{display:flex;flex-wrap:wrap;gap:6px}
.bb{display:inline-grid;place-items:center;min-width:36px;height:36px;padding:0 4px;border-radius:12px;font-weight:800;font-size:1rem;background:var(--card2);border:1px solid var(--line);color:var(--tx)}
.bb.f{background:var(--or);color:#fff;border-color:transparent}.bb.s{background:var(--pu);color:#fff;border-color:transparent}.bb.w{background:var(--rd);color:#fff;border-color:transparent}.bb.x{background:#b8860b;color:#fff;border-color:transparent}.bb.d{color:var(--mu)}
.sb-who{margin-top:8px;font-size:.82rem;color:var(--mu);line-height:1.5}.sb-who b{color:var(--tx)}
.flash{position:fixed;left:50%;top:34%;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;width:150px;height:150px;margin-left:-75px;border-radius:32px;color:#fff;pointer-events:none;text-align:center;border:1px solid rgba(255,255,255,.55);box-shadow:0 20px 60px rgba(10,50,100,.45),inset 0 1px 0 rgba(255,255,255,.5);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);background:rgba(70,90,115,.78)}
.flash b{font-size:4rem;line-height:1}.flash span{font-weight:800;font-size:1rem;letter-spacing:.5px}
.flash.f{background:rgba(22,115,204,.86)}.flash.s{background:rgba(122,71,224,.88)}.flash.w{background:rgba(209,47,53,.88)}.flash.x{background:rgba(167,122,12,.88)}.flash.n{background:rgba(31,154,109,.88)}
.flash.go{display:flex;animation:fl 1.1s ease-out forwards}
@keyframes fl{0%{transform:scale(.5);opacity:0}18%{transform:scale(1.08);opacity:1}30%{transform:scale(1)}80%{opacity:1}100%{transform:scale(1.05);opacity:0}}
.pad{gap:10px}
.pad button.k{aspect-ratio:1/1;min-height:0;padding:2px;border-radius:18px;display:grid;place-items:center;line-height:1.05;font-size:1.5rem;background:var(--glass);border:1px solid var(--glassb);-webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);box-shadow:0 6px 16px rgba(30,100,170,.14),inset 0 1px 0 rgba(255,255,255,.65);color:var(--tx)}
.pad button.k:active{transform:scale(.93)}
.pad button.k.r4{background:linear-gradient(160deg,#5cb1f8,#1673cc);color:#fff}.pad button.k.r6{background:linear-gradient(160deg,#ab84f7,#7a47e0);color:#fff}.pad button.k.w{background:linear-gradient(160deg,#f2777b,#d12f35);color:#fff}
.pad button.k.pri{color:#fff}
.pad button.k:not(.run):not(.r4):not(.r6):not(.w):not(.pri){font-size:.95rem}
/* ===== v5: compact organised scoring + readable tabs ===== */
.sbar{padding:10px 12px;margin-bottom:8px}
.sb-sc{font-size:2.4rem;margin-top:2px}.sb-sc small{font-size:1.2rem}
.sb-ov{min-width:84px;padding:6px 10px;border-radius:16px}.sb-ov b{font-size:1.9rem}.sb-ov small{font-size:.6rem}
.sb-bits{margin-top:6px}
.sg2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.sg2 .sbar{margin:0;display:flex;flex-direction:column;gap:6px;padding:10px;min-width:0}
.bt3{font-size:.72rem;letter-spacing:.8px;text-transform:uppercase;font-weight:800;color:var(--mu)}
.bx{padding:7px 8px;border-radius:14px;background:var(--card2);border:1px solid var(--line);min-width:0}.bx.on{border-color:var(--or);background:var(--orS)}
.bx .bn{font-weight:800;font-size:.92rem;color:var(--tx)}.bx .bn i{font-style:normal;color:var(--or)}
.bx .bv{display:flex;align-items:baseline;gap:5px;flex-wrap:wrap;margin-top:1px}.bx .bv b{font-size:1.35rem;line-height:1.1;color:var(--tx)}.bx .bv span{color:var(--mu);font-size:.85rem}.bx .bv em{font-style:normal;color:var(--mu);font-size:.72rem;font-weight:800;margin-left:auto}
.bx .bs2{font-size:.72rem;color:var(--mu);margin-top:1px}.bx .bs2 b{color:var(--tx)}
.bx .bbs{gap:3px;margin-top:5px}
.bb.sm{min-width:22px;height:22px;border-radius:8px;font-size:.72rem;padding:0 2px}
.lastb.mini{width:auto;flex-direction:row;gap:8px;padding:6px 10px;border-radius:14px;justify-content:center}.lastb.mini small{display:none}.lastb.mini b{font-size:1.4rem}.lastb.mini span{font-size:.72rem}
.pad{grid-template-columns:repeat(5,1fr);gap:7px}
.pad button.k{border-radius:15px;font-size:1.3rem}
.pad button.k:not(.run):not(.r4):not(.r6):not(.w):not(.pri){font-size:.66rem;letter-spacing:.2px;text-transform:uppercase;font-weight:800}
.pad[style*="grid-template-columns"] button.k{aspect-ratio:auto;min-height:48px;font-size:1rem;text-transform:none;letter-spacing:0}
/* tabs: bigger icons, full-contrast labels, never clipped */
.sn.stk{overflow-x:auto;scrollbar-width:none;gap:2px}.sn.stk::-webkit-scrollbar{display:none}
.sn.stk button{flex:1 0 auto;min-width:64px;padding:6px 5px;min-height:56px;gap:2px;font-size:.74rem;font-weight:800;letter-spacing:0;color:var(--tx);overflow:visible;text-overflow:clip;max-width:none}
.sn.stk button i{font-size:1.45rem;line-height:1.1}
.sn.stk button.on{color:#fff}
.bnav button{font-size:.74rem;color:var(--tx);min-height:56px;gap:2px}.bnav button i{font-size:1.45rem;font-style:normal;line-height:1.1}.bnav button.on{color:#fff}
.sn:not(.stk) button{font-size:.95rem;color:var(--tx)}.sn:not(.stk) button.on{color:#fff}
.tab{color:var(--tx)}.tab.on{color:#fff}
.sg2 .sbar{justify-content:flex-start;align-content:flex-start}.sg2 .sbar>*{flex:0 0 auto}.sg2 .lastb.mini{align-self:flex-start}.bt3{text-align:left}
.sn.stk button{flex:1 1 0;min-width:0;padding:6px 1px;font-size:.68rem}.sn.stk button i{font-size:1.35rem}
@media (min-width:480px){.sn.stk button{font-size:.8rem}}
.sg2 .sbar>.bx{align-self:stretch}.sg2 .sbar>.bt3{align-self:flex-start}

.bt2 b{font-size:1.05rem}

<script>
/* ===== ENGINE: pure cricket + tournament logic (no DOM) ===== */
var ENG=(function(){
var E={};
function rn(b){return b.r+(b.x?1:0)}
function calc(m,i){var r=0,w=0,l=0,e=0;(m.d||[]).forEach(function(b){if(b.i!==i)return;r+=rn(b);if(b.x)e+=rn(b);if(b.w)w++;if(!b.x)l++});return{r:r,w:w,l:l,e:e}}
function bt(m,i){return i===0?m.bat:1-m.bat}
function over(m,i){var c=calc(m,i);return c.l>=m.ov*6||c.w>=m.pl-1||(i===1&&c.r>calc(m,0).r)}
function hasI2(m){return m.inn===1||(m.d||[]).some(function(b){return b.i===1})}
function status(m){if(m.nrx)return "done";if(!(m.d||[]).length&&m.inn===0)return "up";if(m.inn===1&&over(m,1))return "done";return "live"}
E.rn=rn;E.calc=calc;E.bt=bt;E.over=over;E.hasI2=hasI2;E.status=status;
E.ovLabel=function(l){return Math.floor(l/6)+"."+(l%6)};
E.uid=function(p){return (p||"x")+Date.now().toString(36)+Math.random().toString(36).slice(2,6)};

/* outcome of a match as team SLOT indexes (0/1 in m.n) */
E.outcome=function(m){
  if(m.nrx)return{done:true,nr:true,w:null,t:false};
  if(status(m)!=="done")return{done:false};
  var a=calc(m,0),b=calc(m,1),s0=bt(m,0),s1=bt(m,1);
  if(b.r>a.r)return{done:true,w:s1,t:false,wk:m.pl-1-b.w};
  if(b.r<a.r)return{done:true,w:s0,t:false,runs:a.r-b.r};
  if(m.tb===0||m.tb===1)return{done:true,w:m.tb,t:true,tbw:true};
  return{done:true,w:null,t:true};
};
/* NRR inputs per slot: runs/overs for and against */
E.nrrInput=function(m){
  var out=[{rf:0,of:0,ra:0,oa:0},{rf:0,of:0,ra:0,oa:0}];
  [0,1].forEach(function(i){
    var c=calc(m,i),slot=bt(m,i),opp=1-slot;
    if(i===1&&!hasI2(m))return;
    var ov=(c.w>=m.pl-1)?m.ov:c.l/6;
    out[slot].rf+=c.r;out[slot].of+=ov;
    out[opp].ra+=c.r;out[opp].oa+=ov;
  });
  return out;
};
E.batStat=function(m,i,p){var q={r:0,b:0,f:0,s:0,out:false,w:null};(m.d||[]).forEach(function(x){if(x.i!==i)return;if(x.s===p&&x.x!=="wd"){q.r+=x.r;q.b++;if(x.r===4)q.f++;if(x.r===6)q.s++}if(x.w&&(x.o||x.s)===p){q.out=true;q.w=x}});return q};
E.bowlStat=function(m,i,p){var q={l:0,r:0,w:0,wd:0,nb:0};(m.d||[]).forEach(function(x){if(x.i!==i||x.b!==p)return;if(!x.x)q.l++;q.r+=rn(x);if(x.w&&x.wt!=="runout")q.w++;if(x.x==="wd")q.wd++;if(x.x==="nb")q.nb++});return q};
E.batNames=function(m,i){var o=[];(m.d||[]).forEach(function(x){if(x.i!==i)return;[x.s,x.w?x.o:null].forEach(function(p){if(p&&o.indexOf(p)<0)o.push(p)})});return o};
E.names=function(m,i,k){var o=[];(m.d||[]).forEach(function(x){if(x.i===i&&x[k]&&o.indexOf(x[k])<0)o.push(x[k])});return o};

/* ---------- tournament structure ---------- */
E.DEF={ov:6,pl:6,pts:{w:2,t:1,nr:1,l:0},q:2,third:false,rd:1,G:1};
E.rules=function(t){var r=t.rules||{},d=E.DEF,p=r.pts||{};return{ov:r.ov||d.ov,pl:r.pl||d.pl,pts:{w:p.w==null?2:p.w,t:p.t==null?1:p.t,nr:p.nr==null?1:p.nr,l:p.l==null?0:p.l},q:r.q||d.q,third:!!r.third,rd:r.rd||1,G:r.G||1}};
E.fmt=function(t){return t.fmt||"open"};
E.groups=function(t){var o=[];(t.teams||[]).forEach(function(x){var g=x.g||"";if(o.indexOf(g)<0)o.push(g)});return o.sort()};
E.stageKind=function(t,f){var s=(t.stg||[]).filter(function(x){return x.id===f.st})[0];return s?s.k:"lg"};
E.pow2=function(n){var s=1;while(s<n)s*=2;return s};
E.seedOrder=function(n){var o=[1,2];while(o.length<n){var m=o.length*2,nx=[];o.forEach(function(s){nx.push(s,m+1-s)});o=nx}return o};
E.genRR=function(ids,rounds){
  var teams=ids.slice();if(teams.length%2)teams.push(null);
  var n=teams.length,out=[];
  for(var rd=0;rd<(rounds||1);rd++){
    var arr=teams.slice();
    for(var r=0;r<n-1;r++){
      for(var i=0;i<n/2;i++){var a=arr[i],b=arr[n-1-i];if(a&&b)out.push(rd%2?[b,a]:[a,b])}
      arr.splice(1,0,arr.pop());
    }
  }
  return out;
};
/* knockout bracket from seed refs (team id string | {k:'rank',g,r}) */
E.genKO=function(refs,third,startNo){
  var N=refs.length;if(N<2)return{fx:[],stg:[]};
  var size=E.pow2(N),order=E.seedOrder(size);
  var layer=order.map(function(s){return s<=N?refs[s-1]:null});
  var fx=[],stg=[],no=startNo||1,prev=[],prevId="";
  while(layer.length>1){
    var left=layer.length,sid=left===2?"final":left===4?"sf":left===8?"qf":"r"+left,next=[],rfx=[];
    if(left===2&&third&&prev.length===2&&prevId==="sf"){
      var tf={id:"f"+no,no:no++,st:"third",a:{k:"l",f:prev[0].id},b:{k:"l",f:prev[1].id}};
      fx.push(tf);stg.push({id:"third",k:"ko"});
    }
    for(var i=0;i<left;i+=2){
      var a=layer[i],b=layer[i+1];
      if(a==null&&b==null){next.push(null);continue}
      if(a==null||b==null){next.push(a==null?b:a);continue}
      var f={id:"f"+no,no:no++,st:sid,a:a,b:b};
      fx.push(f);rfx.push(f);next.push({k:"w",f:f.id});
    }
    if(rfx.length)stg.push({id:sid,k:"ko"});
    prev=rfx;prevId=sid;layer=next;
  }
  return{fx:fx,stg:stg};
};
E.groupLetter=function(i){return String.fromCharCode(65+i)};
/* generate everything for a tournament config. returns {teams,fx,stg} */
E.genFixtures=function(t){
  var R=E.rules(t),f=E.fmt(t),teams=(t.teams||[]).map(function(x){var c=JSON.parse(JSON.stringify(x));c.g="";return c});
  var fx=[],stg=[],no=1;
  function addPairs(pairs,st,g){pairs.forEach(function(p){fx.push({id:"f"+no,no:no++,st:st,g:g||"",a:p[0],b:p[1]})})}
  if(f==="league"){
    addPairs(E.genRR(teams.map(function(x){return x.id}),R.rd),"lg","");
    stg.push({id:"lg",k:"lg",g:""});
  }else if(f==="knockout"){
    var ko=E.genKO(teams.map(function(x){return x.id}),R.third,1);
    fx=ko.fx;stg=ko.stg;
  }else if(f==="hybrid"){
    var G=Math.max(1,Math.min(R.G,Math.floor(teams.length/2)||1));
    teams.forEach(function(x,i){var row=Math.floor(i/G),col=i%G;x.g=E.groupLetter(row%2===0?col:G-1-col)});
    var gl=[];for(var g=0;g<G;g++)gl.push(E.groupLetter(g));
    gl.forEach(function(L){
      var ids=teams.filter(function(x){return x.g===L}).map(function(x){return x.id});
      addPairs(E.genRR(ids,R.rd),"grp-"+L,L);stg.push({id:"grp-"+L,k:"lg",g:L});
    });
    var minSize=Math.min.apply(null,gl.map(function(L){return teams.filter(function(x){return x.g===L}).length}));
    var q=Math.max(1,Math.min(R.q,minSize)),refs=[];
    for(var r=1;r<=q;r++)gl.forEach(function(L){refs.push({k:"rank",g:L,r:r})});
    var ko2=E.genKO(refs,R.third,no);
    fx=fx.concat(ko2.fx);stg=stg.concat(ko2.stg);
  }else if(f==="series"){
    var n=Math.max(1,(t.ser&&t.ser.n)||3);
    for(var i=0;i<n;i++)fx.push({id:"f"+(i+1),no:i+1,st:"ser",g:"",a:teams[0].id,b:teams[1].id});
    stg.push({id:"ser",k:"ser",g:""});
  }
  return{teams:teams,fx:fx,stg:stg};
};
/* assign date/time to fixtures. start 'YYYY-MM-DD', perDay count, base 'HH:MM' */
E.schedule=function(fx,start,perDay,base){
  if(!start)return fx;
  var p=start.split("-").map(Number),pd=Math.max(1,perDay||1),bm=(base||"16:00").split(":"),bmin=(+bm[0])*60+(+bm[1]||0);
  fx.forEach(function(f,i){
    var day=Math.floor(i/pd),k=i%pd,d=new Date(Date.UTC(p[0],p[1]-1,p[2]+day)),mm=Math.min(bmin+k*180,1380);
    function z(n){return (n<10?"0":"")+n}
    f.dt=d.getUTCFullYear()+"-"+z(d.getUTCMonth()+1)+"-"+z(d.getUTCDate())+"T"+z(Math.floor(mm/60))+":"+z(mm%60);
  });
  return fx;
};

/* ---------- derived tournament state ---------- */
E.ctx=function(t,getM){
  var F={},memoR={},memoS={},cx={t:t,F:F};
  (t.fx||[]).forEach(function(f){F[f.id]=f});
  cx.slot=function(s){
    if(s==null)return null;
    if(typeof s==="string")return s;
    if(s.k==="w"||s.k==="l"){var r=cx.res(F[s.f]);if(!r.done)return null;return s.k==="w"?r.win||null:r.lose||null}
    if(s.k==="rank"){var st=cx.stand(s.g);if(!st.complete)return null;var row=st.rows[s.r-1];return row?row.id:null}
    return null;
  };
  cx.res=function(f){
    if(!f)return{done:false};
    if(memoR[f.id])return memoR[f.id];
    var r={done:false,live:false,started:false,a:cx.slot(f.a),b:cx.slot(f.b),f:f,m:null,nr:false,tie:false,win:null,lose:null};
    memoR[f.id]=r;
    var m=f.mid?getM(f.mid):null;
    if(m){
      r.m=m;r.started=true;r.live=E.status(m)==="live";
      var o=E.outcome(m);
      if(o.done){
        r.done=true;r.nr=!!o.nr;r.tie=!!o.t&&!o.tbw;
        if(m.tm){r.a=m.tm[0]||r.a;r.b=m.tm[1]||r.b}
        if(o.w!=null&&m.tm){r.win=m.tm[o.w];r.lose=m.tm[1-o.w];r.ws=o.w}
      }
    }
    return r;
  };
  cx.stand=function(g){
    var key=g||"";
    if(memoS[key])return memoS[key];
    var rules=E.rules(t),P=rules.pts,rows={},order=[];
    (t.teams||[]).forEach(function(x){if((x.g||"")===key){rows[x.id]={id:x.id,P:0,W:0,L:0,T:0,NR:0,pts:0,rf:0,of:0,ra:0,oa:0,nrr:0};order.push(x.id)}});
    var fxs=(t.fx||[]).filter(function(f){return E.stageKind(t,f)==="lg"&&(f.g||"")===key});
    var complete=fxs.length>0,doneN=0;
    fxs.forEach(function(f){
      var r=cx.res(f);
      if(!r.done){complete=false;return}
      doneN++;
      var A=rows[r.a],B=rows[r.b];if(!A||!B)return;
      if(r.nr){A.NR++;B.NR++;A.pts+=P.nr;B.pts+=P.nr;return}
      A.P++;B.P++;
      if(r.win){var W=rows[r.win],L=rows[r.lose];W.W++;L.L++;W.pts+=P.w;L.pts+=P.l}
      else{A.T++;B.T++;A.pts+=P.t;B.pts+=P.t}
      var ni=E.nrrInput(r.m);
      [[A,0],[B,1]].forEach(function(z){var n=ni[z[1]];z[0].rf+=n.rf;z[0].of+=n.of;z[0].ra+=n.ra;z[0].oa+=n.oa});
    });
    var arr=order.map(function(id){var x=rows[id];x.nrr=(x.of?x.rf/x.of:0)-(x.oa?x.ra/x.oa:0);return x});
    arr.sort(function(a,b){return b.pts-a.pts||b.nrr-a.nrr||b.W-a.W||(order.indexOf(a.id)-order.indexOf(b.id))});
    var out={rows:arr,complete:complete,n:fxs.length,done:doneN,q:rules.q};
    memoS[key]=out;return out;
  };
  cx.series=function(){
    var tm=t.teams||[],A=tm[0]&&tm[0].id,B=tm[1]&&tm[1].id;
    var list=(t.fx||[]).slice().sort(function(x,y){return x.no-y.no}),n=list.length;
    var mode=(t.ser&&t.ser.mode)||"bestof",thr=mode==="bestof"?Math.floor(n/2)+1:null;
    var w={},played=0,ties=0,allDone=true,st={};w[A]=0;w[B]=0;
    list.forEach(function(f){var r=cx.res(f);if(r.done){if(!r.nr)played++;if(r.win&&w[r.win]!=null)w[r.win]++;else if(!r.nr)ties++;st[f.id]="done"}else allDone=false});
    var decided=!!thr&&(w[A]>=thr||w[B]>=thr),nextFound=false;
    list.forEach(function(f){
      if(st[f.id]==="done")return;
      var r=cx.res(f);
      if(decided)st[f.id]="nr";
      else if(r.live)st[f.id]="live",nextFound=true;
      else if(!nextFound){st[f.id]="next";nextFound=true}
      else st[f.id]="upcoming";
    });
    var finished=decided||allDone,winner=null;
    if(decided)winner=w[A]>=thr?A:B;
    else if(allDone&&w[A]!==w[B])winner=w[A]>w[B]?A:B;
    var nrN=list.filter(function(f){return st[f.id]==="nr"}).length;
    return{a:A,b:B,wa:w[A]||0,wb:w[B]||0,played:played,total:n,thr:thr,mode:mode,decided:decided,finished:finished,winner:winner,tied:finished&&!winner,st:st,nrN:nrN,remaining:n-played-nrN,ties:ties,list:list};
  };
  cx.champ=function(){
    var f=E.fmt(t);
    if(t.ch&&(t.ch.w||t.ch.r))return{done:true,manual:true,win:t.ch.w,lose:t.ch.r};
    if(f==="series"){var s=cx.series();return s.finished?{done:true,win:s.winner,lose:s.winner?(s.winner===s.a?s.b:s.a):null,tied:s.tied}:{done:false}}
    if(f==="knockout"||f==="hybrid"){var fin=(t.fx||[]).filter(function(x){return x.st==="final"})[0];if(!fin)return{done:false};var r=cx.res(fin);return r.done&&r.win?{done:true,win:r.win,lose:r.lose}:{done:false}}
    if(f==="league"){var s2=cx.stand("");return s2.complete&&s2.rows.length>1?{done:true,win:s2.rows[0].id,lose:s2.rows[1].id}:{done:false}}
    return{done:false};
  };
  return cx;
};

/* ---------- player statistics across matches ---------- */
E.playerStats=function(ms,tname){
  var bat={},bowl={};
  ms.forEach(function(m){
    [0,1].forEach(function(i){
      if(i===1&&!hasI2(m))return;
      var bs=bt(m,i),batTeam=tname(m,bs),bowlTeam=tname(m,1-bs);
      E.batNames(m,i).forEach(function(p){
        var q=E.batStat(m,i,p),k=p+"|"+batTeam,o=bat[k]||(bat[k]={n:p,team:batTeam,r:0,b:0,f:0,s:0,inns:0,outs:0,hs:0});
        o.r+=q.r;o.b+=q.b;o.f+=q.f;o.s+=q.s;o.inns++;if(q.out)o.outs++;if(q.r>o.hs)o.hs=q.r;
      });
      E.names(m,i,"b").forEach(function(p){
        var q=E.bowlStat(m,i,p),k=p+"|"+bowlTeam,o=bowl[k]||(bowl[k]={n:p,team:bowlTeam,l:0,r:0,w:0,inns:0});
        o.l+=q.l;o.r+=q.r;o.w+=q.w;o.inns++;
      });
    });
  });
  var B=Object.keys(bat).map(function(k){return bat[k]}).sort(function(a,b){return b.r-a.r||a.b-b.b});
  var W=Object.keys(bowl).map(function(k){return bowl[k]}).sort(function(a,b){return b.w-a.w||(a.l?a.r/a.l:99)-(b.l?b.r/b.l:99)});
  return{bat:B,bowl:W};
};

/* ---------- commentary ---------- */
E.snap=function(m){var i=m.inn,c=calc(m,i);return{mid:m.id,inn:i,sr:c.r,sw:c.w,sl:c.l,so:E.ovLabel(c.l)}};
E.groupFeed=function(list){
  var a=list.slice().sort(function(x,y){return (y.ts-x.ts)||((y.id||"")>(x.id||"")?1:-1)}),out=[];
  a.forEach(function(e){var L=out[out.length-1];if(L&&L.cid===e.cid)L.items.push(e);else out.push({cid:e.cid,name:e.cn,items:[e]})});
  return out;
};
E.entryText=function(e){return e.text||""};
E.validComment=function(text,m,tg){
  var s=(text||"").trim();
  if(!s)return"empty";
  if(s.length>400)return"long";
  if(tg&&tg.pl&&tg.k!=="team"){
    var all=(m.p[0]||[]).concat(m.p[1]||[]);
    if(all.indexOf(tg.pl)<0)return"player";
  }
  return"";
};

/* ---------- scoreboard detail helpers ---------- */
E.freeHit=function(m,i){var fh=false;E.balls(m,i).forEach(function(b){if(b.x==="nb")fh=true;else if(b.x!=="wd")fh=false});return fh};
E.balls=function(m,i){return (m.d||[]).filter(function(b){return b.i===i})};
E.overs=function(m,i){
  var lb=0,cr=0,cw=0,list=[],cur=null;
  E.balls(m,i).forEach(function(b){
    var o=Math.floor(lb/6)+1;
    if(!cur||cur.n!==o){cur={n:o,balls:[],runs:0,wk:0,bw:[],legal:0,cumR:0,cumW:0};list.push(cur)}
    cur.balls.push(b);var r=rn(b);cur.runs+=r;cr+=r;
    if(b.w){cur.wk++;cw++}
    if(b.b&&cur.bw.indexOf(b.b)<0)cur.bw.push(b.b);
    if(!b.x){lb++;cur.legal++}
    cur.cumR=cr;cur.cumW=cw;
  });
  list.forEach(function(o){o.done=o.legal>=6;o.maiden=o.done&&o.runs===0});
  return list};
E.fow=function(m,i){
  var lb=0,cr=0,w=0,out=[];
  E.balls(m,i).forEach(function(b){
    cr+=rn(b);if(!b.x)lb++;
    if(b.w){w++;out.push({n:w,name:b.o||b.s,r:cr,ov:Math.floor(lb/6)+"."+(lb%6),how:b})}
  });
  return out};
E.partnerships=function(m,i){
  var segs=[],cw=0;
  function fresh(){return{r:0,b:0,ex:0,bats:{},order:[]}}
  var cur=fresh();
  function bat(n){if(!n)return null;if(!cur.bats[n]){cur.bats[n]={n:n,r:0,b:0};cur.order.push(n)}return cur.bats[n]}
  function fin(c,wn,un){
    return{n:wn,r:c.r,b:c.b,ex:c.ex,unbroken:un,pair:c.order.map(function(k){return c.bats[k]})}}
  E.balls(m,i).forEach(function(b){
    if(b.pc){bat(b.pc[0]);bat(b.pc[1])}
    cur.r+=rn(b);if(!b.x)cur.b++;if(b.x)cur.ex+=rn(b);
    if(b.s){var q=bat(b.s);if(b.x!=="wd"){q.r+=b.r;q.b++}}
    if(b.w){bat(b.o||b.s);cw++;segs.push(fin(cur,cw,false));cur=fresh()}
  });
  var has=cur.b>0||cur.r>0;
  if(has||(!segs.length&&E.balls(m,i).length===0&&false))segs.push(fin(cur,cw+1,true));
  return segs};
E.extras=function(m,i){
  var o={wd:0,nb:0,wdN:0,nbN:0,total:0};
  E.balls(m,i).forEach(function(b){if(b.x==="wd"){o.wd+=rn(b);o.wdN++}else if(b.x==="nb"){o.nb+=rn(b);o.nbN++}});
  o.total=o.wd+o.nb;return o};
E.yetToBat=function(m,i){
  var side=bt(m,i),seen=E.batNames(m,i),c=m.cs||{},live=m.inn===i&&!over(m,i);
  return (m.p[side]||[]).filter(function(p){return seen.indexOf(p)<0&&!(live&&(c.s===p||c.n===p))})};
E.rr=function(m,i){var c=calc(m,i);return c.l?c.r*6/c.l:0};
E.projected=function(m,i){var c=calc(m,i);return c.l?Math.round(c.r/c.l*m.ov*6):0};
E.rrr=function(m){var c=calc(m,1),need=calc(m,0).r+1-c.r,left=m.ov*6-c.l;return left>0?need*6/left:0};
E.worm=function(m,i){
  var pts=[{x:0,r:0}],wk=[],lb=0,cr=0;
  E.balls(m,i).forEach(function(b){
    cr+=rn(b);if(!b.x){lb++;pts.push({x:lb/6,r:cr})}
    if(b.w)wk.push({x:lb/6,r:cr,name:b.o||b.s})});
  return{pts:pts,wk:wk}};
E.rrSeries=function(m,i){
  var o=E.overs(m,i),out=[];
  o.forEach(function(v){var legal=v.legal,x=(v.n-1)+legal/6;out.push({x:x,rr:x?v.cumR/x:0,r:v.runs,n:v.n,w:v.wk})});
  return out};
E.statusText=function(m){
  var o=E.outcome(m);if(o.done)return null;
  if(!(m.d||[]).length&&m.inn===0)return{k:"toss"};
  if(m.inn===1||hasI2(m)){
    var c=calc(m,1),need=calc(m,0).r+1-c.r,left=m.ov*6-c.l;
    return{k:"chase",need:need,left:left,wk:m.pl-1-c.w}}
  if(over(m,0))return{k:"break",target:calc(m,0).r+1};
  return{k:"bat",proj:E.projected(m,0)}};

return E;
})();

var E=ENG;
</script>

function niceStep(max,n){var raw=max/n,p=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10)),f=raw/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}

var CH={W:360,H:220,L:34,R:14,T:12,B:26};
function sx(x,xm){return CH.L+(x/xm)*(CH.W-CH.L-CH.R)}
function sy(y,ym){return CH.H-CH.B-(y/ym)*(CH.H-CH.T-CH.B)}
function gridY(ay,fmt){var h="";for(var v=0;v<=ay.top+1e-9;v+=ay.step){var y=sy(v,ay.top);h+='<line class="gl" x1="'+CH.L+'" x2="'+(CH.W-CH.R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(CH.L-5)+'" y="'+(y+3)+'" text-anchor="end">'+(fmt?fmt(v):dg(v))+'</text>'}return h}
function gridX(xm,every){var h="";for(var v=0;v<=xm;v+=every){var x=sx(v,xm);h+='<text x="'+x+'" y="'+(CH.H-8)+'" text-anchor="middle">'+dg(v)+'</text>'}return h+'<line class="ax" x1="'+CH.L+'" x2="'+(CH.W-CH.R)+'" y1="'+(CH.H-CH.B)+'" y2="'+(CH.H-CH.B)+'"/>'}
function xEvery(xm){return xm<=10?1:xm<=20?2:5}

function selLine(xm,k){return gsel>0&&gsel<=xm?'<line x1="'+sx(gsel-.5,xm)+'" x2="'+sx(gsel-.5,xm)+'" y1="'+CH.T+'" y2="'+(CH.H-CH.B)+'" stroke="var(--tx)" stroke-width="1" stroke-dasharray="3 3" opacity=".6"/>':""}
function path(pts,xm,ym){return pts.map(function(p,k){return (k?"L":"M")+sx(p.x,xm).toFixed(1)+" "+sy(p.r!=null?p.r:p.rr,ym).toFixed(1)}).join("")}

var THEME="auto";
function applyTheme(mode){
  THEME=mode==="light"||mode==="dark"?mode:"auto";
  var r=document.documentElement;if(THEME==="auto")r.removeAttribute("data-skin");else r.setAttribute("data-skin",THEME);
  var b=document.getElementById("thm");if(b)b.textContent=THEME==="light"?"☀️":THEME==="dark"?"🌙":"🌓";
}
function setTheme(m){lsSet("hku_theme",m);applyTheme(m);drawSheet()}
function drawSheet(){

  if(!SHEET){e.hidden=true;e.innerHTML="";return}

var SHEET=false;
document.getElementById("sheet").addEventListener("click",function(ev){
  var b=ev.target.closest("[data-th],[data-lg]");
  if(!b){if(ev.target.id==="sheet"){SHEET=false;drawSheet()}return}
  if(b.dataset.lg){setLang(b.dataset.lg);drawSheet();return}
  if(b.dataset.th==="close"){SHEET=false;drawSheet();return}
  setTheme(b.dataset.th)});

var PL={name:"",tf:"all",back:null},tmx={};
function plk(p){return '<a class="plk" role="button" tabindex="0" data-a="player" data-v="'+esc(p)+'">'+esc(p)+'</a>'}
function pn(m,p){return jn(m,p)+plk(p)}

/* ---------- player history ---------- */
function pRecs(name){
  var recs=[];
  Object.keys(T).forEach(function(k){matchesOf(k).forEach(function(m){
    if(!(m.d&&m.d.length))return;
    [0,1].forEach(function(sl){
      if((m.p[sl]||[]).indexOf(name)<0)return;
      var bi=bt(m,0)===sl?0:1,r={m:m,k:k,sl:sl,bi:bi,team:tn(m,sl),opp:tn(m,1-sl),bat:null,bowl:null};
      if(E.batNames(m,bi).indexOf(name)>=0)r.bat=E.batStat(m,bi,name);
      var bq=E.bowlStat(m,1-bi,name);if(bq.l||bq.r)r.bowl=bq;
      var oc=E.outcome(m);r.res=!oc.done?"live":oc.nr?"N":oc.w==null?"T":oc.w===sl?"W":"L";
      var f=fixOf(m);r.ts=(f&&f.dt?Date.parse(f.dt):0)||m.ct||0;r.f=f;recs.push(r)})})});
  recs.sort(function(a,b){return b.ts-a.ts});return recs}
function pCareer(recs){
  var c={m:recs.length,inn:0,no:0,r:0,b:0,f:0,s:0,hs:0,hsNo:false,fifty:0,w:0,bl:0,rc:0,bestW:0,bestR:0};
  recs.forEach(function(r){
    if(r.bat){c.inn++;if(!r.bat.out)c.no++;c.r+=r.bat.r;c.b+=r.bat.b;c.f+=r.bat.f;c.s+=r.bat.s;if(r.bat.r>=50)c.fifty++;
      if(r.bat.r>c.hs||(r.bat.r===c.hs&&!r.bat.out&&!c.hsNo)){c.hs=r.bat.r;c.hsNo=!r.bat.out}}
    if(r.bowl){c.w+=r.bowl.w;c.bl+=r.bowl.l;c.rc+=r.bowl.r;
      if(r.bowl.w>c.bestW||(r.bowl.w===c.bestW&&c.bestW>0&&r.bowl.r<c.bestR)){c.bestW=r.bowl.w;c.bestR=r.bowl.r}}});
  return c}
function tstat(l,v){return '<span>'+l+' <b>'+v+'</b></span>'}
function playerV(){
  var name=PL.name,recs=pRecs(name),h='<button class="back" data-a="plback">'+t("back")+'</button>';
  if(!recs.length)return h+'<div class="mhead"><b style="font-size:1.2rem">'+esc(name)+'</b></div><div class="card empty">'+t("noHist")+'</div>';
  var tids=[];recs.forEach(function(r){if(tids.indexOf(r.k)<0)tids.push(r.k)});
  if(PL.tf!=="all"&&tids.indexOf(PL.tf)<0)PL.tf="all";
  var fr=PL.tf==="all"?recs:recs.filter(function(r){return r.k===PL.tf}),c=pCareer(fr);
  var teams=[],jer="";recs.forEach(function(r){if(teams.indexOf(r.team)<0)teams.push(r.team);if(!jer){jer=(r.m.j&&r.m.j[r.sl]&&r.m.j[r.sl][name])||""}});
  var out=c.inn-c.no,avg=out>0?(c.r/out).toFixed(1):"—",sr=c.b?(c.r*100/c.b).toFixed(1):"—",econ=c.bl?(c.rc*6/c.bl).toFixed(1):"—";
  h+='<div class="mhead"><div class="row"><span class="lg l" style="--c:'+hashCol(name)+';width:54px;height:54px;font-size:1.1rem">'+esc(initials(name))+'</span><div class="grow"><div style="font-family:\'Anek Bangla\',\'Hind Siliguri\',sans-serif;font-weight:800;font-size:1.35rem;line-height:1.15;word-break:break-word">'+esc(name)+'</div><div class="mu">'+(jer?'#'+esc(jer)+' · ':'')+teams.map(esc).join(", ")+'</div></div></div>'+
  '<div class="kp">'+tstat(t("pMt"),dg(c.m))+tstat(t("pInns"),dg(c.inn))+tstat(t("R"),dg(c.r))+tstat(t("pHs"),c.hs?dg(c.hs)+(c.hsNo?"*":""):"—")+tstat(t("pAvg"),dg(avg))+tstat(t("SR"),dg(sr))+tstat("4s",dg(c.f))+tstat("6s",dg(c.s))+'</div>'+
  '<div class="kp">'+tstat(t("W"),dg(c.w))+tstat(t("bestL"),c.bestW?dg(c.bestW)+"/"+dg(c.bestR):"—")+tstat(t("oversL"),ovt(c.bl))+tstat(t("Eco"),dg(econ))+tstat(t("fiftyL"),dg(c.fifty))+'</div></div>';
  if(tids.length>1)h+='<div class="seg"><button class="'+(PL.tf==="all"?"on":"")+'" data-a="pltf" data-v="all">'+t("allT")+'</button>'+tids.map(function(k){return '<button class="'+(PL.tf===k?"on":"")+'" data-a="pltf" data-v="'+k+'">'+esc(nmx(T[k].n))+'</button>'}).join("")+'</div>';
  h+='<div class="cmh"><h3>📜 '+t("history")+' · '+dg(fr.length)+'</h3></div>';
  fr.forEach(function(r){
    var m=r.m,x=T[r.k]||{n:["",""]},pc=r.res==="W"?"gr":r.res==="L"?"rd":r.res==="live"?"or":"",q=r.bat,w=r.bowl;
    h+='<div class="card mc" data-a="openm" data-v="'+m.id+'"><div class="mh"><b class="ell">'+t("vs")+' '+esc(r.opp)+'</b>'+pill(pc,t(r.res==="W"?"rW":r.res==="L"?"rL":r.res==="T"?"rT":r.res==="N"?"rN":"rLive"))+'</div>'+
    '<div class="mu sm">'+esc(nmx(x.n))+(mTag(m)?' · '+esc(mTag(m)):'')+(r.ts?' · '+fmtDay(r.ts):'')+' · '+esc(r.team)+'</div>'+
    (q?'<div class="pl"><span>🏏 '+t("bat")+'</span><b>'+dg(q.r)+' <span class="mu">('+dg(q.b)+')</span> <span class="mu sm">· 4s '+dg(q.f)+' · 6s '+dg(q.s)+' · '+t("SR")+' '+dg(q.b?(q.r*100/q.b).toFixed(1):"0.0")+'</span></b></div><div class="mu sm" style="margin-top:-2px">'+howOut(q)+'</div>':'<div class="mu sm" style="margin-top:4px">🏏 '+t("dnb")+'</div>')+
    (w?'<div class="pl"><span>⚾ '+t("bowl")+'</span><b>'+ovt(w.l)+'-'+dg(w.r)+'-'+dg(w.w)+' <span class="mu sm">· '+t("Eco")+' '+dg(w.l?(w.r*6/w.l).toFixed(1):"0.0")+'</span></b></div>':'')+'</div>'});
  return h}

/* ---------- Teams tab ---------- */
function teamList(x){
  var list=[],by={},ms=matchesOf(x.id);
  function ensure(key,name,tm){if(!by[key]){by[key]={key:key,name:name,tm:tm,players:[]};list.push(by[key])}return by[key]}
  (x.teams||[]).forEach(function(tm){var e=ensure("t"+tm.id,nmx(tm.n),tm);(tm.p||[]).forEach(function(p){e.players.push({n:p.n,j:p.j||""})})});
  ms.forEach(function(m){[0,1].forEach(function(sl){
    var id=m.tm&&m.tm[sl],name=tn(m,sl),e=id&&by["t"+id]?by["t"+id]:ensure("n"+name,name,null);
    (m.p[sl]||[]).forEach(function(p){if(!e.players.some(function(z){return z.n===p}))e.players.push({n:p,j:(m.j&&m.j[sl]&&m.j[sl][p])||""})})})});
  return list}
function teamsTab(x){

  var all=matchesOf(x.id),ms=all.filter(function(m){return m.d&&m.d.length}),ps=E.playerStats(ms,tn),ts=teamStats(all);
  var h='<div class="mu sm" style="margin:2px 2px 8px">'+t("teamHelp")+'</div>';

document.addEventListener("keydown",function(ev){

function loadJs(src){return new Promise(function(res,rej){var e=document.createElement("script");e.src=src;e.onload=res;e.onerror=rej;document.head.appendChild(e)})}
/* Firestore cannot store arrays inside arrays (e.g. players per team) -> encode/decode transparently */
function fsEnc(v){
  if(Array.isArray(v)){if(v.some(Array.isArray))return {__na:v.map(function(x){return {a:fsEnc(x)}})};return v.map(fsEnc)}
  if(v&&typeof v==="object"){var o={};Object.keys(v).forEach(function(k){o[k]=fsEnc(v[k])});return o}
  return v}
function fsDec(v){
  if(Array.isArray(v))return v.map(fsDec);
  if(v&&typeof v==="object"){if(Array.isArray(v.__na))return v.__na.map(function(x){return fsDec(x.a)});var o={};Object.keys(v).forEach(function(k){o[k]=fsDec(v[k])});return o}
  return v}
function fsSnap(sn){return {id:sn.id,exists:sn.exists,data:function(){return fsDec(sn.data())}}}
function fsWrap(d){return {
  collection:function(c){return {onSnapshot:function(ok,er){return d.collection(c).onSnapshot(function(s){ok({docs:s.docs.map(fsSnap)})},er)}}},
  doc:function(p){var r=d.doc(p);return {
    set:function(o){return r.set(fsEnc(o))},update:function(o){return r.update(fsEnc(o))},
    get:function(){return r.get().then(fsSnap)},delete:function(){return r.delete()}}}}}
function bootFirebase(cfg){FBMODE=true;
  var V="https://www.gstatic.com/firebasejs/10.12.2/";
  loadJs(V+"firebase-app-compat.js").then(function(){return loadJs(V+"firebase-firestore-compat.js")}).then(function(){
    firebase.initializeApp(cfg);var d=firebase.firestore();
    try{d.settings({ignoreUndefinedProperties:true,experimentalAutoDetectLongPolling:true,merge:true})}catch(e){}
    db=fsWrap(d);dbOn=true;canWrite=false;
    subscribe();sub("templates",function(s){TPL=s.docs.map(function(x){var v=JSON.parse(JSON.stringify(x.data()));v.id=x.id;return v})});
    initIdentity();draw();
  }).catch(function(){FBFAIL=true;canWrite=false;dbOn=false;initIdentity();draw()});
  setTimeout(function(){if(dbOn&&!loaded){loaded=true;draw()}},10000)}
function boot(){
  if(!(window.claude&&claude.use)&&window.HKU_FIREBASE&&window.HKU_FIREBASE.apiKey&&window.HKU_FIREBASE.projectId){return bootFirebase(window.HKU_FIREBASE)}

    setTimeout(function(){if(dbOn&&!loaded){loaded=true;draw()}},10000);
  }else{canWrite=true;initIdentity();subscribeMemesLocal();draw()}
}

    var lo=0,hi=1;put(1);if(bot()<=goal){__fitK=key;__fitG=1;return}

  var fonts=[];try{fonts=[document.fonts.load('700 20px "Hind Siliguri"'),document.fonts.load('800 20px "Anek Bangla"'),document.fonts.load('600 14px "Hind Siliguri"')]}catch(e){}
  Promise.all(fonts.map(function(p){return p.catch(function(){})})).then(function(){
    return Promise.all([loadImg(x.lid&&logoU(x.lid)),loadImg(logoOfTeam(m,0)),loadImg(logoOfTeam(m,1)),loadImg(logoU(brandId("hku")))])
  }).then(function(r){
    var I={tour:r[0],t:[r[1],r[2]],dev:r[3]};
    /* find the biggest scale that fits one A4 page */
    var tc=document.createElement("canvas");tc.width=PW;tc.height=PH;var tcx=tc.getContext("2d"),s=1,lim=PH-52;
    while(s>0.52){var res=render(tcx,m,s,I);if(res.y<=lim)break;s=Math.round((s-0.02)*100)/100}
    var S=2,cv=document.createElement("canvas");cv.width=PW*S;cv.height=PH*S;var c=cv.getContext("2d");c.scale(S,S);
    c.imageSmoothingQuality="high";render(c,m,s,I);footer(c,I);
    cv.toBlob(function(b){BUSY=false;if(!b){toast(L2("Could not create image","ছবি তৈরি করা যায়নি"));return}showModal(b,fname(m))},"image/jpeg",0.93)
  }).catch(function(e){BUSY=false;console.error(e);toast(L2("Export failed","এক্সপোর্ট ব্যর্থ"))})}

/* ---------- buttons ---------- */
function bar(id){return '<div class="a4bar"><button class="k pri" data-a="a4x" data-v="'+id+'">📄 '+L2("Download A4 Scorecard (JPG)","A4 স্কোরকার্ড ডাউনলোড (JPG)")+'</button></div>'}
ACT.a4x=function(el){exportA4(el.dataset.v)};

var _mv=matchV;
matchV=function(){
  var h=_mv(),m=getMatch(mid);if(!m)return h;
  var back='<button class="back" data-a="home">'+t("back")+'</button>',i=h.indexOf(back);
  return i===0?back+bar(m.id)+h.slice(back.length):bar(m.id)+h};

var _amb=admMatchBody;
admMatchBody=function(m){return bar(m.id)+_amb(m)};

/* match cards on the home list: small quick button for finished matches */
var _card=card;
card=function(m){
  var h=_card(m);if(mst(m)==="up")return h;
  return h.replace(/<\/div>$/,'<div class="ac" style="margin-top:6px"><button class="k sm" data-a="a4x" data-v="'+m.id+'" onclick="event.stopPropagation()">📄 A4 JPG</button></div></div>')};
/* the card itself opens the match on click; stop the button click from also opening it */
var _openm=ACT.openm;
ACT.openm=function(el,ev){if(ev&&ev.target&&ev.target.closest&&ev.target.closest('[data-a="a4x"]'))return;_openm(el,ev)};
document.addEventListener("keydown",function(ev){if(ev.key==="Escape")closeModal()});
}
})();
</script>
