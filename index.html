    cv.toBlob(function(b){BUSY=false;if(!b){toast(L2("Could not create image","ছবি তৈরি করা যায়নি"));return}showModal(b,fname(m))},"image/jpeg",0.93)
  }).catch(function(e){BUSY=false;console.error(e);toast(L2("Export failed","এক্সপোর্ট ব্যর্থ"))})}

/* ---------- buttons ---------- */
function bar(id){return '<div class="a4bar"><button class="k pri" data-a="a4x" data-v="'+id+'">📄 '+L2("Download A4 Scorecard (JPG)","A4 স্কোরকার্ড ডাউনলোড (JPG)")+'</button></div>'}
ACT.a4x=function(el){exportA4(el.dataset.v)};

var _mv=matchV;
matchV=function(){
  var h=_mv(),m=getMatch(mid);if(!m)return h;
  var back='<button class="back" data-a="home">'+t("back")+'</button>',i=h.indexOf(back);
  return i===0?back+bar(m.id)+h.slice(back.length):bar(m.id)+h};

var _amb=admMatchBody;
admMatchBody=function(m){return bar(m.id)+_amb(m)};

/* match cards on the home list: small quick button for finished matches */
var _card=card;
card=function(m){
  var h=_card(m);if(mst(m)==="up")return h;
  return h.replace(/<\/div>$/,'<div class="ac" style="margin-top:6px"><button class="k sm" data-a="a4x" data-v="'+m.id+'" onclick="event.stopPropagation()">📄 A4 JPG</button></div></div>')};
/* the card itself opens the match on click; stop the button click from also opening it */
var _openm=ACT.openm;
ACT.openm=function(el,ev){if(ev&&ev.target&&ev.target.closest&&ev.target.closest('[data-a="a4x"]'))return;_openm(el,ev)};
document.addEventListener("keydown",function(ev){if(ev.key==="Escape")closeModal()});
}
})();
</script>
